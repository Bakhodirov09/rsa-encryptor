<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encrypt Ai ™</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000000;
    --main-bg: #1e2128;
    --card-bg: #12151b;
    --border: rgba(255,255,255,0.07);
    --text: #ffffff;
    --muted: #8b8fa8;
    --blue: #4a9eff;
    --blue-dim: rgba(74,158,255,0.15);
    --green: #34d399;
    --red: #f87171;
  }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* TOP NAV */
  .topnav {
    background: var(--black);
    border-bottom: 1px solid var(--border);
    padding: 0 36px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }

  .logo {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .nav-btn {
    background: transparent;
    border: 1.5px solid var(--blue);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 7px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-btn:hover { background: var(--blue-dim); }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    padding-top: 64px;
  }

  /* SIDEBAR */
  .sidebar {
    width: 210px;
    background: var(--black);
    border-right: 1px solid var(--border);
    padding: 28px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: fixed;
    top: 64px; bottom: 0; left: 0;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
  }

  .sidebar-item:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.03);
  }

  .sidebar-item.active {
    color: var(--text);
    border-color: var(--blue);
    background: var(--blue-dim);
  }

  /* MAIN */
  .main {
    flex: 1;
    margin-left: 210px;
    background: var(--main-bg);
    min-height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
  }

  .page-title {
    font-size: clamp(2rem, 4vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    text-align: center;
  }

  .page-sub {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 44px;
    text-align: center;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    width: 100%;
    max-width: 540px;
    animation: riseUp 0.4s ease both;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .card-icon {
    width: 38px; height: 38px;
    background: var(--blue-dim);
    border: 1px solid rgba(74,158,255,0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .card-title { font-size: 1rem; font-weight: 700; }
  .card-desc  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

  label {
    display: block;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    margin-top: 20px;
  }

  label:first-of-type { margin-top: 0; }

  textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: 'Inter', monospace;
    font-size: 0.85rem;
    padding: 14px 16px;
    color: var(--text);
    outline: none;
    resize: vertical;
    min-height: 120px;
    transition: border-color 0.2s;
    line-height: 1.6;
  }

  textarea::placeholder { color: var(--muted); }
  textarea:focus { border-color: rgba(74,158,255,0.5); }

  .encrypt-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: var(--blue);
    border: none;
    border-radius: 12px;
    color: #000;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.02em;
  }

  .encrypt-btn:hover {
    background: #6ab4ff;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(74,158,255,0.3);
  }

  .encrypt-btn:active { transform: translateY(0); }

  /* RESULT */
  .result {
    display: none;
    margin-top: 20px;
    background: rgba(52,211,153,0.05);
    border: 1px solid rgba(52,211,153,0.2);
    border-radius: 12px;
    padding: 16px;
    animation: riseUp 0.3s ease;
  }

  .result.show  { display: block; }
  .result.error { background: rgba(248,113,113,0.05); border-color: rgba(248,113,113,0.2); }

  .result-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 10px;
  }

  .result.error .result-label { color: var(--red); }

  .result-text {
    font-size: 0.74rem;
    word-break: break-all;
    line-height: 1.7;
    color: rgba(255,255,255,0.6);
    max-height: 120px;
    overflow-y: auto;
    font-family: monospace;
  }

  .copy-btn {
    margin-top: 12px;
    background: transparent;
    border: 1px solid rgba(52,211,153,0.35);
    color: var(--green);
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .copy-btn:hover { background: rgba(52,211,153,0.1); }

  /* MINI STEPS */
  .steps-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .step-mini {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    font-size: 0.7rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .step-mini .n {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 5px;
  }

  /* FOOTER */
  .footer {
    background: var(--black);
    border-top: 1px solid var(--border);
    padding: 18px 40px;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
    margin-left: 210px;
  }

  @keyframes riseUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .main, .footer { margin-left: 0; }
    .steps-row { flex-direction: column; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <div class="logo">Encrypt Ai ™</div>
  <button class="nav-btn">Dashboard</button>
</nav>

<div class="layout">

  <aside class="sidebar">
    <button class="sidebar-item active">🔐&nbsp; Encrypt Data</button>
  </aside>

  <main class="main">

    <div class="page-title">Encrypt Your Data</div>
    <p class="page-sub">RSA-4096 · End-to-end · Zero server · Browser only</p>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">🔐</div>
        <div>
          <div class="card-title">Secure Encryption</div>
          <div class="card-desc">Encrypted in your browser. Never transmitted anywhere.</div>
        </div>
      </div>

      <label>Your secret — API key, token, password…</label>
      <textarea id="plaintext" placeholder="Shifrlash uchun matn..."></textarea>

      <button class="encrypt-btn" onclick="encryptMessage()">
        🔐&nbsp; Shifrlash
      </button>

      <div class="result" id="result">
        <div class="result-label" id="resultLabel">✓ Encrypted</div>
        <div class="result-text" id="resultText"></div>
        <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy Encrypted Text</button>
      </div>
    </div>

  </main>
</div>

<footer class="footer">Encrypt Ai ™</footer>

<script>
// ─── PASTE YOUR PUBLIC KEY HERE ─────────────────────────────────────────────
const PUBLIC_KEY_PEM = `-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA7gV2qKwo2t0YLipbj/D3
nOHXkKEE0xVzSuwUWsYQXTVBO8/ybMKDxnGMi1dTleC0ejaozvipgngbUHksmjcj
ekj+UUXj/L/aeWMsGRE+pXEGYF1xA+fJ0cV9DMX33F3lLPBx7xgqSh0GpWs415AA
8hQDXoE2ksmsEWSlbVTQK2iOgReEXg2/jACuJoB1gPEjgKFLbd7w9sIYrMmHjam/
KQtsabXmOXwwcIAiRICozTq9Uyvf2dvMKNHo2+taZNvh4QoGmmt7TIRI45ie4l7R
CfYS4FI1Xxd69fUvUtTWZUfX9inuN+eKzeH8jETYT4rqeERl8eYRZi4VZOhKylfs
qKIldPzBBASi1nCpEAV3+LMBpaMRJXdAdj4Nxc5rwz8ZyWQwcs4lSn/aWu7UUQlP
PLVWlck0O69MUU7CZh9GkXn9aVe7h25rFIyGo1FsShJOEJKZl37sr2WpRKg1NEQD
uk7QX3yU/KtJCjLqSLRM8e8CiPhMCTl+x5BxaxG8JZWy4MlxNn3ZjZZINk6lp18J
WESruw8LGkW9Oxt/5TzmjpDFW9gn/GQcSastLU/9uST8z4nZkfNR1amuwdSAeRO9
we1kW3Ck4JsokuVFAx8aJUhDZhsCA8ceCUszR+G+MywcsoSG0RBv99DkDNrgHKDO
4US+uSv3BV8DK2j0haXLDOUCAwEAAQ==
-----END PUBLIC KEY-----`;
// ────────────────────────────────────────────────────────────────────────────

async function importPublicKey(pem) {
  const b64 = pem.replace(/-----[^-]+-----/g, '').replace(/\s/g, '');
  const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return crypto.subtle.importKey('spki', buf, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
}

async function encryptMessage() {
  const plaintext = document.getElementById('plaintext').value.trim();
  if (!plaintext) { showError('Please enter something to encrypt.'); return; }
  if (PUBLIC_KEY_PEM.includes('YOUR_PUBLIC_KEY_HERE')) {
    showError('⚠ Not configured yet — the site owner needs to add their public key.');
    return;
  }
  try {
    const enc = new TextEncoder();
    const aesKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
    const rawAes = await crypto.subtle.exportKey('raw', aesKey);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, enc.encode(plaintext));
    const pubKey = await importPublicKey(PUBLIC_KEY_PEM);
    const encAesKey = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pubKey, rawAes);
    const encAesKeyArr = new Uint8Array(encAesKey);
    const keyLen = encAesKeyArr.length;
    const total = new Uint8Array(2 + keyLen + 12 + cipherBuf.byteLength);
    total.set([keyLen >> 8, keyLen & 0xff], 0);
    total.set(encAesKeyArr, 2);
    total.set(iv, 2 + keyLen);
    total.set(new Uint8Array(cipherBuf), 2 + keyLen + 12);
    document.getElementById('resultText').textContent = `RSA::${btoa(String.fromCharCode(...total))}`;
    document.getElementById('resultLabel').textContent = '✓ Encrypted — safe to share anywhere';
    const r = document.getElementById('result');
    r.classList.remove('error');
    r.classList.add('show');
  } catch(e) { showError('Encryption failed: ' + e.message); }
}

function showError(msg) {
  document.getElementById('resultText').textContent = msg;
  document.getElementById('resultLabel').textContent = '✗ Error';
  const r = document.getElementById('result');
  r.classList.add('show', 'error');
}

function copyResult() {
  navigator.clipboard.writeText(document.getElementById('resultText').textContent).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = 'Copy Encrypted Text', 2000);
  });
}
</script>
</body>
</html>
